# FAQ
faq.title=Жиі қойылатын сұрақтар
faq.subtitle=Брондау, төлеу және сапарлар туралы сұрақтарға жауаптар
faq.q1=Турды қалай брондауға болады?
faq.a1=Каталогтан ұнаған турды таңдап, күндерді көрсетіп, «Брондау» батырмасын басыңыз немесе себетке қосыңыз. Содан кейін тапсырысты ресімдеп, төлем жасаңыз.
faq.q2=Қандай төлем түрлері бар?
faq.a2=Біз банк карталарын, жедел төлем жүйесін (СБП), криптовалютаны және сату кеңселерінде қолма-қол ақшаны қабылдаймыз.
faq.q3=Ваучерді қалай аламын?
faq.a3=Төлем жасалғаннан кейін электрондық поштаңызға дербес QR-коды бар ресми PDF ваучер жіберіледі.
faq.q4=Промокод қолдануға бола ма?
faq.a4=Иә! Төлем бетінде жарамды промокодты енгізіңіз. Жеңілдік бірден есептеледі.
faq.q5=Қолдау қызметіне қалай хабарласуға болады?
faq.a5=Сайттағы онлайн-чат арқылы немесе Telegram-бот арқылы хабарласа аласыз.

