# FAQ
faq.title=Жиі қойылатын сұрақтар
faq.subtitle=Брондау, төлем және сапарлар туралы танымал сұрақтарға жауаптар
faq.q1=Турды қалай брондауға болады?
faq.a1=Каталогтан ұнаған турды таңдап, күндер мен қонақтар санын көрсетіп, «Брондау» немесе себетке қосыңыз, содан кейін төлемге өтіңіз.
faq.q2=Қандай төлем түрлері қолжетімді?
faq.a2=Біз банк карталарын (Visa, Mastercard, МИР), лездік төлемдер жүйесін, криптовалютаны (USDT, BTC) және сату кеңселерінде қолма-қол ақшаны қабылдаймыз.
faq.q3=Ваучерді қалай аламын?
faq.a3=Сәтті төлемнен кейін сіздің email-ге қонақүйге тіркелу және ұшу үшін жеке QR-коды бар ресми PDF-ваучер жіберіледі.
faq.q4=Промокодты қалай пайдалануға болады?
faq.a4=Иә! Төлем бетінде жарамды промокодты (мысалы, WELCOME10) енгізіңіз. Жеңілдік бірден есептеледі.
faq.q5=Қолдау қызметіне қалай хабарласуға болады?
faq.a5=Сайттағы онлайн-чат арқылы немесе Telegram-бот арқылы хабарласа аласыз.

