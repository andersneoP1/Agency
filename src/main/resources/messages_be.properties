# FAQ
faq.title=Часта задаваныя пытанні
faq.subtitle=Адказы на папулярныя пытанні аб браніраванні, аплаце і паездках
faq.q1=Як забраніраваць тур?
faq.a1=Выберыце тур у каталогу, укажыце даты і колькасць гасцей, націсніце «Забраніраваць» або дадайце ў кошык. Затым аформіце заказ і аплаціце.
faq.q2=Якія спосабы аплаты падтрымліваюцца?
faq.a2=Мы прымаем банкаўскія карты, СБП, крыптавалюту і наяўныя ў нашых офісах продажаў.
faq.q3=Як я атрымаю ваўчар?
faq.a3=Адразу пасля аплаты на ваш email адпраўляецца PDF-ваўчар з персанальным QR-кодам.
faq.q4=Ці можна выкарыстаць промакод?
faq.a4=Так! Увядзіце дзеючы промакод на старонцы аплаты. Зніжка будзе прыменена імгненна.
faq.q5=Як звязацца з падтрымкай?
faq.a5=Вы можаце скарыстацца анлайн-чатам на сайце альбо напісаць у наш афіцыйны Telegram-бот.

