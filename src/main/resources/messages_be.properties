# FAQ
faq.title=Частыя пытанні
faq.subtitle=Адказы на папулярныя пытанні пра браніраванне, аплату і паездкі
faq.q1=Як забраніраваць тур?
faq.a1=Выберыце тур у каталогу, укажыце даты і колькасць гасцей, націсніце «Забраніраваць» ці дадайце ў кошык, пасля чаго перайдзіце да афармлення.
faq.q2=Якія спосабы аплаты падтрымліваюцца?
faq.a2=Мы прымаем аплату банкаўскімі картамі, праз сістэму хуткіх плацяжоў, крыптавалютай (USDT) і наяўнымі.
faq.q3=Як атрымаць ваўчар?
faq.a3=Адразу пасля аплаты на ваш email адпраўляецца афіцыйны PDF-ваўчар з персанальным QR-кодам для хуткай рэгістрацыі.
faq.q4=Ці можна прымяніць промакод?
faq.a4=Так! Увядзіце дзеючы промакод (напрыклад, WELCOME10) на старонцы аплаты. Зніжка разлічыцца імгненна.
faq.q5=Як звязацца з падтрымкай?
faq.a5=Вы можаце скарыстацца анлайн-чатам на сайце альбо напісаць у наш афіцыйны Telegram-бот.

