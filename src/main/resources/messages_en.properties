# FAQ
faq.title=Frequently Asked Questions
faq.subtitle=Answers to common questions about bookings, payments, and travels
faq.q1=How do I book a tour?
faq.a1=Select your desired tour in the catalog, choose your travel dates and number of guests, click "Book Now" or add it to your cart, then proceed to checkout and secure payment.
faq.q2=What payment methods are supported?
faq.a2=We accept credit and debit cards (Visa, Mastercard, MIR), Fast Payment System (FPS), cryptocurrency (USDT, BTC), and cash in our retail branches.
faq.q3=How do I receive my booking voucher and travel documents?
faq.a3=Immediately after successful payment, an official PDF voucher with a personalized QR code is sent to your email for quick hotel check-in and flight boarding. You can also download it anytime from your personal profile.
faq.q4=Can I apply a discount promo code?
faq.a4=Yes! Enter a valid promotional code (such as WELCOME10) on the checkout page. The discount is calculated and deducted from your total amount instantly.
faq.q5=How do I contact customer support?
faq.a5=You can use our live chat widget at the bottom right corner, reach out to our official Telegram bot, or call our toll-free customer helpline.

