# FAQ
faq.title=Frequently Asked Questions
faq.subtitle=Quick answers to common questions regarding bookings, payments and travel
faq.q1=How do I book a tour?
faq.a1=Select your desired tour in the catalog, choose dates and number of guests, click 'Book Now' or add to cart. Then proceed to checkout and payment.
faq.q2=What payment methods are supported?
faq.a2=We accept credit and debit cards (MIR, Visa, Mastercard), Fast Payment System (SBP), cryptocurrency (USDT, BTC) and cash at regional offices.
faq.q3=How do I receive my voucher and travel itinerary?
faq.a3=Immediately after successful payment, an official PDF voucher with a personalized QR code is emailed to you. You can also download it from your personal profile.
faq.q4=Can I apply a discount promo code?
faq.a4=Yes! Enter an active promo code (e.g. WELCOME10) on the payment page. The discount will be applied immediately to the total amount.
faq.q5=How can I contact support?
faq.a5=You can use our live chat widget at the bottom right corner, contact our official Telegram bot, or call our toll-free customer helpline.

