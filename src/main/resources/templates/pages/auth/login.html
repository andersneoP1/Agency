<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" class="h-100">
<head th:replace="~{fragments/head :: head('Вход в систему')}">
    <title>Вход | Native Travel</title>
</head>
<body class="d-flex flex-column h-100 bg-light font-sans">

    <!-- Header Navigation -->
    <header th:replace="~{fragments/navbar :: navbar('login')}"></header>

    <!-- Main Content Container -->
    <main class="flex-shrink-0 my-auto py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5 col-xl-4">
                    <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5"
                         x-data="{
                             email: '',
                             password: '',
                             errorMessage: '',
                             loading: false,
                             async submitLogin() {
                                 this.errorMessage = '';
                                 this.loading = true;
                                 try {
                                     const res = await fetch('/api/v1/auth/login', {
                                         method: 'POST',
                                         headers: { 'Content-Type': 'application/json' },
                                         body: JSON.stringify({ email: this.email, password: this.password })
                                     });
                                     const data = await res.json();
                                     if (res.ok) {
                                         window.location.href = '/';
                                     } else {
                                         this.errorMessage = data.detail || 'Неверный логин или пароль';
                                     }
                                 } catch (err) {
                                     this.errorMessage = 'Ошибка сети. Попробуйте позже.';
                                 } finally {
                                     this.loading = false;
                                 }
                             }
                         }">
                        
                        <div class="text-center mb-4">
                            <i class="bi bi-person-circle text-warning fs-1"></i>
                            <h3 class="fw-bold mt-2" th:text="#{auth.login.title}">Вход в аккаунт</h3>
                            <p class="text-muted small" th:text="#{auth.login.subtitle}">Войдите, чтобы управлять вашими бронированиями</p>
                        </div>

                        <!-- Alerts -->
                        <div th:if="${registered}" class="alert alert-success small py-2" role="alert">
                            <i class="bi bi-check-circle me-1"></i> Регистрация успешна! Теперь вы можете войти.
                        </div>
                        <div th:if="${reset}" class="alert alert-success small py-2" role="alert">
                            <i class="bi bi-check-circle me-1"></i> Пароль успешно изменен!
                        </div>
                        <div x-show="errorMessage" x-text="errorMessage" class="alert alert-danger small py-2" role="alert" style="display: none;"></div>

                        <form @submit.prevent="submitLogin()">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" x-model="email" class="form-control border-start-0" placeholder="name@example.com" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label class="form-label small fw-semibold" th:text="#{auth.login.password}">Пароль</label>
                                    <a th:href="@{/recovery}" class="small text-decoration-none text-muted" th:text="#{auth.login.forgot}">Забыли пароль?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" x-model="password" class="form-control border-start-0" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-2 shadow-sm" :disabled="loading">
                                <span x-show="!loading"><i class="bi bi-box-arrow-in-right me-1"></i> <span th:text="#{auth.login.btn}">Войти</span></span>
                                <span x-show="loading" style="display: none;"><span class="spinner-border spinner-border-sm me-1"></span> Вход...</span>
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="small text-muted" th:text="#{auth.login.no_account}">Нет аккаунта? </span>
                            <a th:href="@{/register}" class="small fw-semibold text-warning text-decoration-none" th:text="#{auth.login.register_link}">Зарегистрироваться</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Chat Widget -->
    <div th:replace="~{fragments/chat-widget :: chat-widget}"></div>
</body>
</html>
