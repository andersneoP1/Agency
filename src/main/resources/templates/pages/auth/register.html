<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" class="h-100">
<head th:replace="~{fragments/head :: head('Регистрация')}">
    <title>Регистрация | Native Travel</title>
</head>
<body class="d-flex flex-column h-100 bg-light font-sans">

    <!-- Header Navigation -->
    <header th:replace="~{fragments/navbar :: navbar('register')}"></header>

    <!-- Main Content Container -->
    <main class="flex-shrink-0 my-auto py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5"
                         x-data="registerApp(window.REGISTER_CONFIG)">

                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus text-warning fs-1"></i>
                            <h3 class="fw-bold mt-2" th:text="#{auth.register.title}">Создать аккаунт</h3>
                            <p class="text-muted small" th:text="#{auth.register.subtitle}">Присоединяйтесь к тысячам счастливых путешественников</p>
                        </div>

                        <div x-show="errorMessage" x-text="errorMessage" class="alert alert-danger small py-2" role="alert" style="display: none;"></div>

                        <form @submit.prevent="submitRegister()">
                            <div class="row g-2 mb-3">
                                <div class="col-sm-6">
                                    <label class="form-label small fw-semibold">Имя</label>
                                    <input type="text" x-model="firstName" class="form-control" placeholder="Иван" required>
                                    <span class="text-danger small" x-text="fieldErrors.firstName"></span>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label small fw-semibold">Фамилия</label>
                                    <input type="text" x-model="lastName" class="form-control" placeholder="Иванов" required>
                                    <span class="text-danger small" x-text="fieldErrors.lastName"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Email</label>
                                <input type="email" x-model="email" class="form-control" placeholder="ivan@example.com" required>
                                <span class="text-danger small" x-text="fieldErrors.email"></span>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Номер телефона</label>
                                <input type="tel" x-model="phone" class="form-control" placeholder="+7 (999) 000-00-00">
                                <span class="text-danger small" x-text="fieldErrors.phone"></span>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Пароль</label>
                                <input type="password" x-model="password" class="form-control" placeholder="Минимум 8 знаков (буквы и цифры)" required>
                                <span class="text-danger small" x-text="fieldErrors.password"></span>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Подтверждение пароля</label>
                                <input type="password" x-model="confirmPassword" class="form-control" placeholder="Повторите пароль" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Реферальный промокод (если есть)</label>
                                <input type="text" x-model="referralCode" class="form-control text-uppercase" placeholder="NT-XXXXXXXX">
                            </div>

                            <div class="form-check mb-4 small text-muted">
                                <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                                <label class="form-check-label" for="termsCheck">
                                    Я согласен с условиями использования и политикой конфиденциальности
                                </label>
                            </div>

                            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm btn-shimmer" :disabled="loading">
                                <span x-show="!loading"><i class="bi bi-check-lg me-1"></i> Зарегистрироваться</span>
                                <span x-show="loading" style="display: none;"><span class="spinner-border spinner-border-sm me-1"></span> Регистрация...</span>
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="small text-muted">Уже есть учетная запись? </span>
                            <a th:href="@{/login}" class="small fw-semibold text-warning text-decoration-none">Войти</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Chat Widget -->
    <div th:replace="~{fragments/chat-widget :: chat-widget}"></div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        window.REGISTER_CONFIG = {
            referralCode: /*[[${referralCode ?: ''}]]*/ ''
        };
        /*]]>*/

        function registerApp(config) {
            config = config || {};
            return {
                firstName: '',
                lastName: '',
                email: '',
                phone: '',
                password: '',
                confirmPassword: '',
                referralCode: config.referralCode || '',
                errorMessage: '',
                fieldErrors: {},
                loading: false,
                async submitRegister() {
                    this.errorMessage = '';
                    this.fieldErrors = {};
                    if (this.password !== this.confirmPassword) {
                        this.errorMessage = 'Пароли не совпадают';
                        return;
                    }
                    this.loading = true;
                    try {
                        const res = await fetch('/api/v1/auth/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                firstName: this.firstName,
                                lastName: this.lastName,
                                email: this.email,
                                phone: this.phone,
                                password: this.password,
                                referralCode: this.referralCode || null
                            })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            window.location.href = '/login?registered=true';
                        } else {
                            this.errorMessage = data.detail || 'Ошибка регистрации';
                            if (data.errors) {
                                this.fieldErrors = data.errors;
                            }
                        }
                    } catch (err) {
                        this.errorMessage = 'Ошибка сети. Попробуйте позже.';
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
