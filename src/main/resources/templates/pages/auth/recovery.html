<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" class="h-100">
<head th:replace="~{fragments/head :: head('Восстановление пароля')}">
    <title>Восстановление пароля | Native Travel</title>
</head>
<body class="d-flex flex-column h-100 bg-light font-sans">

    <!-- Header Navigation -->
    <header th:replace="~{fragments/navbar :: navbar('recovery')}"></header>

    <!-- Main Content Container -->
    <main class="flex-shrink-0 my-auto py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5 col-xl-4">
                    <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5"
                         x-data="{
                             email: '',
                             errorMessage: '',
                             loading: false,
                             async submitRecovery() {
                                 this.errorMessage = '';
                                 this.loading = true;
                                 try {
                                     const res = await fetch('/api/v1/auth/recovery', {
                                         method: 'POST',
                                         headers: { 'Content-Type': 'application/json' },
                                         body: JSON.stringify({ email: this.email })
                                     });
                                     if (res.ok) {
                                         window.location.href = '/recovery/confirm?email=' + encodeURIComponent(this.email);
                                     } else {
                                         const data = await res.json();
                                         this.errorMessage = data.detail || 'Не удалось отправить код';
                                     }
                                 } catch (err) {
                                     this.errorMessage = 'Ошибка сети. Попробуйте позже.';
                                 } finally {
                                     this.loading = false;
                                 }
                             }
                         }">

                        <div class="text-center mb-4">
                            <i class="bi bi-key text-warning fs-1"></i>
                            <h3 class="fw-bold mt-2">Забыли пароль?</h3>
                            <p class="text-muted small">Введите адрес почты, и мы отправим 6-значный проверочный код</p>
                        </div>

                        <div x-show="errorMessage" x-text="errorMessage" class="alert alert-danger small py-2" role="alert" style="display: none;"></div>

                        <form @submit.prevent="submitRecovery()">
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Email адрес</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" x-model="email" class="form-control border-start-0" placeholder="name@example.com" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm" :disabled="loading">
                                <span x-show="!loading"><i class="bi bi-send me-1"></i> Отправить код</span>
                                <span x-show="loading" style="display: none;"><span class="spinner-border spinner-border-sm me-1"></span> Отправка...</span>
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <a th:href="@{/login}" class="small fw-semibold text-muted text-decoration-none">
                                <i class="bi bi-arrow-left me-1"></i> Вернуться ко входу
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Chat Widget -->
    <div th:replace="~{fragments/chat-widget :: chat-widget}"></div>
</body>
</html>
