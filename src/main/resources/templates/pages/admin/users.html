<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" class="h-100">
<head th:replace="~{fragments/head :: head(${pageTitle ?: 'Пользователи'})}">
    <title>Пользователи | Native Travel</title>
</head>
<body class="admin-page d-flex flex-column h-100 bg-light">

    <!-- Admin Navbar -->
    <div th:replace="~{fragments/admin-navbar :: admin-navbar('users')}"></div>

    <!-- Main Container -->
    <main class="flex-shrink-0 pb-5">
        <div class="container">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1"><i class="bi bi-people text-warning me-2"></i>Пользователи системы</h2>
                    <p class="text-muted mb-0">Всего аккаунтов: <strong th:text="${usersPage.totalElements}">4</strong></p>
                </div>
            </div>

            <!-- Users Table -->
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white mb-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 5%;">ID</th>
                                <th style="width: 25%;">Пользователь</th>
                                <th style="width: 20%;">Email</th>
                                <th style="width: 15%;">Телефон</th>
                                <th style="width: 15%;">Реф. код</th>
                                <th style="width: 10%;">Статус</th>
                                <th style="width: 10%;" class="text-end">Действие</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${usersPage.content}">
                                <td class="fw-bold text-muted" th:text="${u.id()}">1</td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <img th:src="${u.avatarUrl() ?: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=60'}" 
                                             class="rounded-circle object-fit-cover shadow-sm" style="width: 36px; height: 36px;" alt="Avatar">
                                        <div>
                                            <strong class="d-block" th:text="${u.firstName() + ' ' + u.lastName()}">Иван</strong>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="text-muted" th:text="${u.email()}">ivan@example.com</span>
                                </td>
                                <td>
                                    <small th:text="${u.phone() ?: '—'}">+7999...</small>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border font-monospace" th:text="${u.referralCode()}">NT-IVAN123</span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${u.enabled() ? 'bg-success' : 'bg-danger'}"
                                          th:text="${u.enabled() ? 'АКТИВЕН' : 'ЗАБЛОКИРОВАН'}">
                                        АКТИВЕН
                                    </span>
                                </td>
                                <td class="text-end">
                                    <button class="btn btn-sm" th:classappend="${u.enabled() ? 'btn-outline-danger' : 'btn-outline-success'}"
                                            th:onclick="'toggleUser(' + ${u.id()} + ')'"
                                            th:text="${u.enabled() ? 'Блок' : 'Разблок'}">
                                        Блок
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script>
        async function toggleUser(id) {
            try {
                const res = await fetch('/api/v1/admin/users/' + id + '/toggle-status', { method: 'POST' });
                if (res.ok) {
                    window.location.reload();
                } else {
                    alert('Ошибка при изменении статуса пользователя');
                }
            } catch (e) {
                alert('Сетевая ошибка');
            }
        }
    </script>
</body>
</html>
