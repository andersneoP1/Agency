<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" class="h-100">
<head th:replace="~{fragments/head :: head(${pageTitle ?: 'Управление турами'})}">
    <title>Туры | Native Travel</title>
</head>
<body class="d-flex flex-column h-100 bg-light">

    <!-- Admin Navbar -->
    <div th:replace="~{fragments/admin-navbar :: admin-navbar('tours')}"></div>

    <!-- Main Container -->
    <main class="flex-shrink-0 pb-5">
        <div class="container">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1"><i class="bi bi-compass text-warning me-2"></i>Управление турами</h2>
                    <p class="text-muted mb-0">Всего предложений: <strong th:text="${toursPage.totalElements}">10</strong></p>
                </div>
                <div>
                    <a th:href="@{/admin/tours/new}" class="btn btn-warning fw-bold rounded-pill shadow-sm">
                        <i class="bi bi-plus-circle me-1"></i> Добавить новый тур
                    </a>
                </div>
            </div>

            <!-- Tours Table Card -->
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 5%;">ID</th>
                                <th style="width: 35%;">Тур и Направление</th>
                                <th style="width: 15%;">Отель</th>
                                <th style="width: 12%;">Даты / Дней</th>
                                <th style="width: 13%;">Цена</th>
                                <th style="width: 8%;">Мест</th>
                                <th style="width: 12%;" class="text-end">Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="tour : ${toursPage.content}">
                                <td class="fw-bold text-muted" th:text="${tour.id()}">1</td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <img th:src="${tour.imageUrl() ?: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=100'}" 
                                             class="rounded-3 object-fit-cover shadow-sm" style="width: 48px; height: 48px;" alt="Photo">
                                        <div>
                                            <a th:href="@{'/tours/' + ${tour.id()}}" class="fw-bold text-dark text-decoration-none d-block" th:text="${tour.title()}">Тур</a>
                                            <small class="text-muted" th:text="${tour.country() + ', ' + tour.city()}">Курорт</small>
                                            <span th:if="${tour.hotOffer()}" class="badge bg-danger rounded-pill ms-1">Горящий</span>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span th:if="${tour.hotel() != null}">
                                        <strong th:text="${tour.hotel().name()}">Отель</strong>
                                        <small class="text-warning d-block" th:text="${tour.hotel().stars() + '★'}">5★</small>
                                    </span>
                                    <span th:unless="${tour.hotel() != null}" class="text-muted">—</span>
                                </td>
                                <td>
                                    <small class="text-dark d-block" th:text="${#temporals.format(tour.startDate(), 'dd.MM')} + ' - ' + ${#temporals.format(tour.endDate(), 'dd.MM.yyyy')}">Даты</small>
                                    <small class="text-muted" th:text="${tour.durationDays()} + ' дней'">7 дней</small>
                                </td>
                                <td>
                                    <strong class="text-primary" th:text="${#numbers.formatDecimal(tour.price(), 0, 'WHITESPACE', 0, 'POINT')} + ' ₽'">89 900 ₽</strong>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${tour.availableSlots()}">10</span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group">
                                        <a th:href="@{'/admin/tours/edit/' + ${tour.id()}}" class="btn btn-sm btn-outline-primary" title="Редактировать">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button class="btn btn-sm btn-outline-danger" th:onclick="'deleteTour(' + ${tour.id()} + ')'" title="Удалить">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script>
        async function deleteTour(id) {
            if (!confirm('Вы действительно хотите удалить тур #' + id + '?')) return;
            try {
                const res = await fetch('/api/v1/admin/tours/' + id, { method: 'DELETE' });
                if (res.ok) {
                    window.location.reload();
                } else {
                    const data = await res.json();
                    alert(data.detail || 'Ошибка удаления тура');
                }
            } catch (e) {
                alert('Сетевая ошибка при удалении');
            }
        }
    </script>
</body>
</html>
