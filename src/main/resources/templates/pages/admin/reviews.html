<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" class="h-100">
<head th:replace="~{fragments/head :: head(${pageTitle ?: 'Модерация отзывов'})}">
    <title>Модерация отзывов | Native Travel</title>
</head>
<body class="admin-page d-flex flex-column h-100 bg-light">

    <!-- Admin Navbar -->
    <div th:replace="~{fragments/admin-navbar :: admin-navbar('reviews')}"></div>

    <!-- Main Container -->
    <main class="flex-shrink-0 pb-5">
        <div class="container">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1"><i class="bi bi-chat-left-quote text-warning me-2"></i>Модерация отзывов</h2>
                    <p class="text-muted mb-0">Всего отзывов: <strong th:text="${reviewsPage.totalElements}">0</strong></p>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${reviewsPage.empty}" class="card border-0 shadow-sm rounded-4 p-5 text-center my-4 bg-white">
                <i class="bi bi-chat-square-check display-3 text-success mb-3"></i>
                <h4 class="fw-bold">Все отзывы проверены</h4>
                <p class="text-muted">Новых отзывов, ожидающих модерации, в данный момент нет.</p>
            </div>

            <!-- Reviews Table -->
            <div th:unless="${reviewsPage.empty}" class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white mb-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 5%;">ID</th>
                                <th style="width: 20%;">Автор и Тур</th>
                                <th style="width: 10%;">Оценка</th>
                                <th style="width: 35%;">Текст отзыва</th>
                                <th style="width: 10%;">Статус</th>
                                <th style="width: 10%;">Дата</th>
                                <th style="width: 10%;" class="text-end">Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${reviewsPage.content}">
                                <td class="fw-bold text-muted" th:text="${r.id()}">1</td>
                                <td>
                                    <strong class="d-block" th:text="${r.authorName()}">Иван</strong>
                                    <small class="text-muted" th:text="${r.tourTitle()}">Тур в Дубай</small>
                                </td>
                                <td>
                                    <span class="text-warning fw-bold" th:text="${r.rating() + ' ★'}">5 ★</span>
                                </td>
                                <td>
                                    <p class="mb-0 small text-dark" th:text="${r.comment()}">Отличный тур!</p>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${r.approved() ? 'bg-success' : 'bg-warning text-dark'}"
                                          th:text="${r.approved() ? 'ОДОБРЕН' : 'НА ПРОВЕРКЕ'}">
                                        ОДОБРЕН
                                    </span>
                                </td>
                                <td>
                                    <small class="text-muted" th:text="${#temporals.format(r.createdAt(), 'dd.MM.yyyy')}">Дата</small>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group">
                                        <button th:unless="${r.approved()}" class="btn btn-sm btn-outline-success" 
                                                th:onclick="'approveReview(' + ${r.id()} + ')'" title="Одобрить">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger" 
                                                th:onclick="'deleteReview(' + ${r.id()} + ')'" title="Удалить">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script>
        async function approveReview(id) {
            try {
                const res = await fetch('/api/v1/admin/reviews/' + id + '/approve', { method: 'POST' });
                if (res.ok) {
                    alert('Отзыв одобрен!');
                    window.location.reload();
                } else {
                    alert('Ошибка при одобрении отзыва');
                }
            } catch (e) {
                alert('Сетевая ошибка');
            }
        }

        async function deleteReview(id) {
            if (!confirm('Удалить отзыв #' + id + '?')) return;
            try {
                const res = await fetch('/api/v1/admin/reviews/' + id, { method: 'DELETE' });
                if (res.ok) {
                    window.location.reload();
                } else {
                    alert('Ошибка при удалении отзыва');
                }
            } catch (e) {
                alert('Сетевая ошибка');
            }
        }
    </script>
</body>
</html>
