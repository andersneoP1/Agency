<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="admin-navbar(activeTab)" class="admin-header bg-dark text-white py-3 mb-4 shadow">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
        <!-- Logo / Title -->
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-shield-lock-fill text-warning fs-3"></i>
            <div>
                <span class="fs-5 fw-bold text-white">Native</span><span class="fs-5 fw-bold text-warning">Admin</span>
                <span class="badge bg-secondary ms-2 small"><span th:text="#{admin.nav.title}">Панель управления</span></span>
            </div>
        </div>

        <!-- Admin Nav Links -->
        <nav class="d-flex flex-wrap gap-2 admin-nav">
            <a th:href="@{/admin}" class="btn btn-sm rounded-pill" 
               th:classappend="${activeTab == 'dashboard' ? 'btn-warning fw-bold' : 'btn-outline-light'}">
                <i class="bi bi-speedometer2 me-1"></i><span th:text="#{admin.nav.dashboard}">Дашборд</span>
            </a>
            <a th:href="@{/admin/tours}" class="btn btn-sm rounded-pill" 
               th:classappend="${activeTab == 'tours' ? 'btn-warning fw-bold' : 'btn-outline-light'}">
                <i class="bi bi-compass me-1"></i><span th:text="#{admin.nav.tours}">Туры</span>
            </a>
            <a th:href="@{/admin/flights}" class="btn btn-sm rounded-pill"
               th:classappend="${activeTab == 'flights' ? 'btn-warning fw-bold' : 'btn-outline-light'}">
                <span th:text="#{admin.nav.flights}">Авиабилеты</span>
            </a>
            <a th:href="@{/admin/hotels}" class="btn btn-sm rounded-pill" 
               th:classappend="${activeTab == 'hotels' ? 'btn-warning fw-bold' : 'btn-outline-light'}">
                <i class="bi bi-building me-1"></i><span th:text="#{admin.nav.hotels}">Отели</span>
            </a>
            <a th:href="@{/admin/bookings}" class="btn btn-sm rounded-pill" 
               th:classappend="${activeTab == 'bookings' ? 'btn-warning fw-bold' : 'btn-outline-light'}">
                <i class="bi bi-briefcase me-1"></i><span th:text="#{admin.nav.bookings}">Бронирования</span>
            </a>
            <a th:href="@{/admin/reviews}" class="btn btn-sm rounded-pill" 
               th:classappend="${activeTab == 'reviews' ? 'btn-warning fw-bold' : 'btn-outline-light'}">
                <i class="bi bi-chat-left-text me-1"></i><span th:text="#{admin.nav.reviews}">Отзывы</span>
            </a>
            <a th:href="@{/admin/promocodes}" class="btn btn-sm rounded-pill" 
               th:classappend="${activeTab == 'promocodes' ? 'btn-warning fw-bold' : 'btn-outline-light'}">
                <i class="bi bi-ticket-perforated me-1"></i><span th:text="#{admin.nav.promocodes}">Промокоды</span>
            </a>
            <a th:href="@{/admin/users}" class="btn btn-sm rounded-pill" 
               th:classappend="${activeTab == 'users' ? 'btn-warning fw-bold' : 'btn-outline-light'}">
                <i class="bi bi-people me-1"></i><span th:text="#{admin.nav.users}">Пользователи</span>
            </a>
        </nav>

        <!-- Exit to site -->
        <div>
            <a th:href="@{/}" class="btn btn-sm btn-outline-warning rounded-pill" data-nav-tab="true">
                <i class="bi bi-box-arrow-up-right me-1"></i><span th:text="#{admin.nav.back}">На сайт</span>
            </a>
        </div>
    </div>
</div>
</body>
</html>
