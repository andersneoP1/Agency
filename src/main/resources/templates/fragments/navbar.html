<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2">
    <div class="container">
        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center fw-bold" th:href="@{/}">
            <i class="bi bi-compass text-warning fs-3 me-2"></i>
            <span class="fs-4 text-white">Native</span>
            <span class="fs-4 text-warning ms-1">Travel</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <!-- Center Navigation Links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'home'} ? 'active fw-bold text-warning'"
                       th:href="@{/}" th:text="#{nav.home}">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'tours'} ? 'active fw-bold text-warning'"
                       th:href="@{/tours}" th:text="#{nav.tours}">Туры</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'flights'} ? 'active fw-bold text-warning'"
                       th:href="@{/flights}" th:text="#{nav.flights}">Авиабилеты</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'compare'} ? 'active fw-bold text-warning'"
                       th:href="@{/compare}" th:text="#{nav.compare}">Сравнение</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'about'} ? 'active fw-bold text-warning'"
                       th:href="@{/about}" th:text="#{nav.about}">О нас</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'faq'} ? 'active fw-bold text-warning'"
                       th:href="@{/faq}" th:text="#{nav.faq}">FAQ</a>
                </li>
            </ul>

            <!-- Right Side: Utilities, Language, Auth -->
            <div class="d-flex align-items-center gap-3">
                <!-- Favorites Link -->
                <a th:href="@{/favorites}" class="btn btn-outline-light btn-sm position-relative" title="Избранное">
                    <i class="bi bi-heart"></i>
                </a>

                <!-- Cart Link -->
                <a th:href="@{/cart}" class="btn btn-outline-warning btn-sm position-relative" title="Корзина">
                    <i class="bi bi-cart3"></i>
                </a>

                <!-- Language Selector -->
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle text-light" type="button"
                            id="langDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-globe2 me-1"></i>
                        <span th:text="${#locale.language.toUpperCase()}">RU</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="langDropdown">
                        <li><a class="dropdown-item" th:href="@{''(lang='ru')}">🇷🇺 Русский (RU)</a></li>
                        <li><a class="dropdown-item" th:href="@{''(lang='en')}">🇬🇧 English (EN)</a></li>
                        <li><a class="dropdown-item" th:href="@{''(lang='kk')}">🇰🇿 Қазақша (KK)</a></li>
                        <li><a class="dropdown-item" th:href="@{''(lang='be')}">🇧🇾 Беларуская (BE)</a></li>
                    </ul>
                </div>

                <!-- Auth buttons: Anonymous -->
                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm" th:text="#{nav.login}">Войти</a>
                    <a th:href="@{/register}" class="btn btn-warning btn-sm fw-semibold" th:text="#{nav.register}">Регистрация</a>
                </div>

                <!-- Auth buttons: Authenticated -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-sm btn-primary dropdown-toggle d-flex align-items-center" type="button"
                            id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userDropdown">
                        <li>
                            <a class="dropdown-item" th:href="@{/profile}">
                                <i class="bi bi-person me-2"></i><span th:text="#{nav.profile}">Личный кабинет</span>
                            </a>
                        </li>
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item text-danger fw-semibold" th:href="@{/admin}">
                                <i class="bi bi-speedometer2 me-2"></i><span th:text="#{nav.admin}">Админка</span>
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i><span th:text="#{nav.logout}">Выйти</span>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
