<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="chat-widget"
     x-data="{
         open: false,
         sessionId: 'sess-' + Math.random().toString(36).substring(2, 10),
         messages: [
             { sender: 'bot', text: 'Здравствуйте! Я виртуальный помощник Native Travel. Чем могу помочь?' }
         ],
         input: '',
         isSending: false,
         operatorTimer: null,
         operatorTypingTimer: null,
         scheduleOperatorBusyReply() {
             if (this.operatorTimer) clearTimeout(this.operatorTimer);
             if (this.operatorTypingTimer) clearTimeout(this.operatorTypingTimer);

             this.operatorTypingTimer = setTimeout(() => {
                 this.isSending = true;
                 this.$nextTick(() => { this.scrollToBottom(); });
             }, 3500);

             this.operatorTimer = setTimeout(async () => {
                 this.isSending = false;
                 const busyText = 'Все операторы в данный момент заняты, попробуйте позднее...';
                 this.messages.push({ sender: 'bot', text: busyText });
                 this.$nextTick(() => { this.scrollToBottom(); });

                 try {
                     await fetch('/api/v1/support/operator-busy', {
                         method: 'POST',
                         headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify({ sessionId: this.sessionId, message: busyText })
                     });
                 } catch (e) {
                     // non-blocking
                 }
             }, 5000);
         },
         async sendMessage() {
             const text = this.input.trim();
             if (!text || this.isSending) return;
             this.messages.push({ sender: 'user', text: text });
             this.input = '';
             this.isSending = true;
             this.$nextTick(() => { this.scrollToBottom(); });

             try {
                 const [res] = await Promise.all([
                     fetch('/api/v1/support/messages', {
                         method: 'POST',
                         headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify({ sessionId: this.sessionId, message: text })
                     }),
                     new Promise(r => setTimeout(r, 600))
                 ]);
                 if (res.ok) {
                     const data = await res.json();
                     this.messages.push({ sender: 'bot', text: data.message });
                     if (data.escalated || /оператор|человек|менеджер|специалист|консультант/i.test(text)) {
                         this.scheduleOperatorBusyReply();
                     }
                 } else {
                     this.messages.push({ sender: 'bot', text: 'Извините, возникла задержка соединения. Вы можете задать вопрос в Telegram или повторить позже.' });
                 }
             } catch (e) {
                 this.messages.push({ sender: 'bot', text: 'Сервис поддержки временно недоступен. Пожалуйста, напишите в Telegram: @NativeTravelSuppport_bot' });
             } finally {
                 this.isSending = false;
                 this.$nextTick(() => { this.scrollToBottom(); });
             }
         },
         scrollToBottom() {
             const area = this.$refs.msgArea;
             if (area) area.scrollTop = area.scrollHeight;
         }
     }"
     class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050;">
    
    <!-- Chat Window -->
    <div x-show="open"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 transform scale-95"
         x-transition:enter-end="opacity-100 transform scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 transform scale-100"
         x-transition:leave-end="opacity-0 transform scale-95"
         class="card shadow-lg border-0 mb-3" style="width: 360px; height: 460px; display: none;">
        
        <!-- Header -->
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-2 px-3">
            <div class="d-flex align-items-center gap-2">
                <div class="rounded-circle bg-success pulse" style="width: 10px; height: 10px;"></div>
                <div>
                    <div class="fw-bold small" th:text="#{chat.title}">Поддержка Native Travel</div>
                    <div class="text-success small" style="font-size: 11px;" th:text="#{chat.online}">Оператор онлайн</div>
                </div>
            </div>
            <button @click="open = false" type="button" class="btn-close btn-close-white btn-sm" aria-label="Close"></button>
        </div>

        <!-- Messages Area -->
        <div x-ref="msgArea" class="card-body overflow-auto d-flex flex-column gap-2 p-3 bg-light" style="flex: 1;">
            <template x-for="(msg, index) in messages" :key="index">
                <div class="d-flex" :class="msg.sender === 'user' ? 'justify-content-end' : 'justify-content-start'">
                    <div :class="msg.sender === 'user' ? 'bg-primary text-white' : 'bg-white text-dark shadow-sm'"
                         class="p-2 px-3 rounded-3 small" style="max-width: 82%; word-break: break-word; white-space: pre-line;">
                        <span x-text="msg.text"></span>
                    </div>
                </div>
            </template>
            <div x-show="isSending" style="display: none;">
                <div class="d-flex justify-content-start">
                    <div class="bg-white text-muted shadow-sm p-2 px-3 rounded-3 small">
                        <span class="spinner-grow spinner-grow-sm me-1 text-warning"></span>
                        <span th:text="#{chat.typing}">Печатает ответ...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer / Input -->
        <div class="card-footer bg-white border-top p-2">
            <form @submit.prevent="sendMessage()" class="d-flex gap-2">
                <input type="text" x-model="input" class="form-control form-control-sm"
                       placeholder="Напишите вопрос..." th:placeholder="#{chat.placeholder}" required :disabled="isSending">
                <button type="submit" class="btn btn-warning btn-sm" :disabled="isSending">
                    <i class="bi bi-send-fill text-dark"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Toggle Button -->
    <div class="d-flex justify-content-end">
        <button @click="open = !open; if (open) $nextTick(() => scrollToBottom());" type="button"
                class="chat-widget-trigger btn btn-warning rounded-circle shadow-lg d-flex align-items-center justify-content-center"
                style="width: 58px; height: 58px;" title="Онлайн-чат поддержки">
            <i class="bi bi-chat-dots-fill fs-4 text-dark" x-show="!open"></i>
            <i class="bi bi-x-lg fs-4 text-dark" x-show="open" style="display: none;"></i>
        </button>
    </div>
</div>
</body>
</html>
