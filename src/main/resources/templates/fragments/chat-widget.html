<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="chat-widget" x-data="{ open: false, messages: [{ sender: 'bot', text: 'Здравствуйте! Я бот поддержки Native Travel. Чем я могу вам помочь?' }], input: '' }" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050;">
    <!-- Chat Window -->
    <div x-show="open"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 transform scale-95"
         x-transition:enter-end="opacity-100 transform scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 transform scale-100"
         x-transition:leave-end="opacity-0 transform scale-95"
         class="card shadow-lg border-0 mb-3" style="width: 340px; height: 420px; display: none;">
        
        <!-- Header -->
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-2">
            <div class="d-flex align-items-center gap-2">
                <div class="rounded-circle bg-success" style="width: 10px; height: 10px;"></div>
                <span class="fw-semibold small">Поддержка Native Travel</span>
            </div>
            <button @click="open = false" type="button" class="btn-close btn-close-white btn-sm" aria-label="Close"></button>
        </div>

        <!-- Messages Area -->
        <div class="card-body overflow-auto d-flex flex-column gap-2 p-3 bg-light" style="flex: 1;">
            <template x-for="(msg, index) in messages" :key="index">
                <div class="d-flex" :class="msg.sender === 'user' ? 'justify-content-end' : 'justify-content-start'">
                    <div :class="msg.sender === 'user' ? 'bg-primary text-white' : 'bg-white text-dark shadow-sm'"
                         class="p-2 rounded-3 small" style="max-width: 80%; word-break: break-word;">
                        <span x-text="msg.text"></span>
                    </div>
                </div>
            </template>
        </div>

        <!-- Footer / Input -->
        <div class="card-footer bg-white border-top p-2">
            <form @submit.prevent="if(input.trim()) { messages.push({sender: 'user', text: input}); const q = input; input = ''; setTimeout(() => { messages.push({sender: 'bot', text: 'Спасибо за вопрос! Оператор ответит в ближайшее время или проверьте раздел FAQ.'}) }, 600); }" class="d-flex gap-2">
                <input type="text" x-model="input" class="form-control form-control-sm" placeholder="Напишите вопрос..." required>
                <button type="submit" class="btn btn-warning btn-sm">
                    <i class="bi bi-send-fill"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Toggle Button -->
    <div class="d-flex justify-content-end">
        <button @click="open = !open" type="button"
                class="btn btn-warning rounded-circle shadow-lg d-flex align-items-center justify-content-center"
                style="width: 56px; height: 56px;" title="Онлайн-чат">
            <i class="bi bi-chat-dots-fill fs-4 text-dark" x-show="!open"></i>
            <i class="bi bi-x-lg fs-4 text-dark" x-show="open" style="display: none;"></i>
        </button>
    </div>
</div>
</body>
</html>
