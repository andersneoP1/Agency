<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, activePage, content)"
      th:attr="lang=${#locale.language}" lang="ru" class="h-100">
<head th:replace="~{fragments/head :: head(${pageTitle})}">
    <title>Native Travel</title>
</head>
<body class="d-flex flex-column h-100 bg-light font-sans">

    <!-- Header Navigation -->
    <header th:replace="~{fragments/navbar :: navbar(${activePage})}"></header>

    <!-- Main Content Container -->
    <main class="flex-shrink-0" th:insert="${content}">
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Chat Widget -->
    <div th:replace="~{fragments/chat-widget :: chat-widget}"></div>
</body>
</html>
