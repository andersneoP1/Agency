<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, activePage, content)"
      lang="ru" class="h-100">
<head th:replace="~{fragments/head :: head(${pageTitle})}">
    <title>Native Travel</title>
</head>
<body class="d-flex flex-column h-100 bg-light font-sans">

    <!-- Header Navigation -->
    <header th:replace="~{fragments/navbar :: navbar(${activePage})}"></header>

    <!-- Main Content Container -->
    <main class="flex-shrink-0" th:insert="${content}">
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Chat Widget -->
    <div th:replace="~{fragments/chat-widget :: chat-widget}"></div>

    <!-- Bootstrap 5 Bundle JS with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Custom Application JS -->
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
