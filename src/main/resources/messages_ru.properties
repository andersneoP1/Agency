# FAQ
faq.title=Часто задаваемые вопросы
faq.subtitle=Ответы на популярные вопросы о бронировании, оплате и поездках
faq.q1=Как забронировать тур?
faq.a1=Выберите понравившийся тур в каталоге, укажите даты и количество гостей, нажмите «Забронировать» или добавьте в корзину. После этого перейдите к оформлению заказа и оплате.
faq.q2=Какие способы оплаты поддерживаются?
faq.a2=Мы принимаем оплату банковскими картами (МИР, Visa, Mastercard), через Систему быстрых платежей (СБП), криптовалютой (USDT, BTC) и наличными в офисах продаж.
faq.q3=Как я получу ваучер и маршрутную квитанцию?
faq.a3=Сразу после успешной оплаты на ваш email отправляется официальный PDF-ваучер с персональным QR-кодом для быстрой регистрации в отеле и посадки на рейс. Вы также можете скачать ваучер в личном кабинете.
faq.q4=Можно ли применить скидочный промокод?
faq.a4=Да! Введите действующий промокод (например, WELCOME10) на странице оплаты бронирования. Скидка будет рассчитана и вычтена из итоговой суммы мгновенно.
faq.q5=Как связаться с поддержкой при возникновении вопросов?
faq.a5=Вы можете воспользоваться онлайн-чат виджетом в правом нижнем углу сайта, написать в наш официальный Telegram-бот или позвонить по бесплатному номеру горячей линии 8 (800) 555-35-35.

