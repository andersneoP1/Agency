spring:
  datasource:
    url: jdbc:h2:mem:nativetravel_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SEQUENCE IF NOT EXISTS hotels_id_seq\;CREATE SEQUENCE IF NOT EXISTS tours_id_seq\;CREATE SEQUENCE IF NOT EXISTS flights_id_seq\;CREATE SEQUENCE IF NOT EXISTS promo_codes_id_seq\;
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  mail:
    host: localhost
    port: 1025

logging:
  level:
    com.nativetravel: DEBUG

app:
  telegram:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    bot-username: ${TELEGRAM_BOT_USERNAME:NativeTravelSuppport_bot}
    bot-token: ${TELEGRAM_BOT_TOKEN:9255986103:AAExBRvhrYePSat2xM6E9RJXIIaBoWZurtE}
