spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=X-Request-Id RETAIN_FIRST
      httpclient:
        connect-timeout: 2000
        response-timeout: 12s
      routes:
        - id: support-websocket
          uri: lb:ws://support
          predicates:
            - Path=/ws/**
            - Header=Upgrade, websocket
        - id: support-sockjs
          uri: lb://support
          predicates:
            - Path=/ws/**
        - id: identity
          uri: lb://identity
          predicates:
            - Path=/api/v1/auth/**,/api/v1/profile/**
          filters:
            - name: CircuitBreaker
              args:
                name: identity
                fallbackUri: forward:/fallback/identity
                statusCodes: [500, 502, 503, 504]
        - id: identity-openapi
          uri: lb://identity
          predicates:
            - Path=/openapi/identity
          filters:
            - SetPath=/v3/api-docs
        - id: catalog
          uri: lb://catalog
          predicates:
            - Path=/api/v1/tours/**,/api/v1/flights/**,/api/v1/reviews/**
          filters:
            - name: CircuitBreaker
              args:
                name: catalog
                fallbackUri: forward:/fallback/catalog
                statusCodes: [500, 502, 503, 504]
        - id: catalog-openapi
          uri: lb://catalog
          predicates:
            - Path=/openapi/catalog
          filters:
            - SetPath=/v3/api-docs
        - id: booking
          uri: lb://booking
          predicates:
            - Path=/api/v1/bookings/**,/api/v1/cart/**
          filters:
            - name: CircuitBreaker
              args:
                name: booking
                fallbackUri: forward:/fallback/booking
                statusCodes: [500, 502, 503, 504]
        - id: booking-openapi
          uri: lb://booking
          predicates:
            - Path=/openapi/booking
          filters:
            - SetPath=/v3/api-docs
        - id: payments
          uri: lb://payments
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: payments
                fallbackUri: forward:/fallback/payments
                statusCodes: [500, 502, 503, 504]
        - id: payments-openapi
          uri: lb://payments
          predicates:
            - Path=/openapi/payments
          filters:
            - SetPath=/v3/api-docs
        - id: marketing
          uri: lb://marketing
          predicates:
            - Path=/api/v1/promocodes/**,/api/v1/favorites/**,/api/v1/surveys/**
          filters:
            - name: CircuitBreaker
              args:
                name: marketing
                fallbackUri: forward:/fallback/marketing
                statusCodes: [500, 502, 503, 504]
        - id: marketing-openapi
          uri: lb://marketing
          predicates:
            - Path=/openapi/marketing
          filters:
            - SetPath=/v3/api-docs
        - id: communications
          uri: lb://communications
          predicates:
            - Path=/api/v1/subscriptions/**,/api/v1/documents/**,/api/v1/admin/broadcast-hot-offers
          filters:
            - name: CircuitBreaker
              args:
                name: communications
                fallbackUri: forward:/fallback/communications
                statusCodes: [500, 502, 503, 504]
        - id: communications-openapi
          uri: lb://communications
          predicates:
            - Path=/openapi/communications
          filters:
            - SetPath=/v3/api-docs
        - id: support
          uri: lb://support
          predicates:
            - Path=/api/v1/support/**
          filters:
            - name: CircuitBreaker
              args:
                name: support
                fallbackUri: forward:/fallback/support
                statusCodes: [500, 502, 503, 504]
        - id: support-openapi
          uri: lb://support
          predicates:
            - Path=/openapi/support
          filters:
            - SetPath=/v3/api-docs
