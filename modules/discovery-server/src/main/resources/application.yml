server:
  port: ${PORT:8761}
spring:
  application:
    name: discovery-server
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  health:
    readinessstate:
      enabled: true
